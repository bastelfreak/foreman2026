.right-column[
```puppet
# @summary one plan to rule them all!
# @param version which Foreman version do we want?
# @param node systemd where we install foreman
plan foreman::install (
  String[1] $version = '3.19.1',
  TargetSpec $node,
) {
  $os = run_task('facts', $node).first['os']['family']
  if $os == 'RedHat' {
    run_task('yum::update', $node)
  }
  out::message("setting up foreman on ${node}")
  run_task('foreman::add_repo', $node)
  $package = {'action' => 'install', 'name' => 'foreman-service'}
  run_task('package', $node, $params)
  $service = {'action' => 'start', 'name' => 'foreman'}
  $result = run_task('service', $node, $service}
  if $result.ok {
    out::message("worked on ${result.ok_set}")
  }
}
```
